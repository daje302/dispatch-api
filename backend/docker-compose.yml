version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: dispatch_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dispatch
      POSTGRES_PASSWORD: dispatch123
      POSTGRES_DB: dispatch_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dispatch -d dispatch_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
